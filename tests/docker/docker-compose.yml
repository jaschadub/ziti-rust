# Canonical OpenZiti quickstart all-in-one, adapted from
# https://github.com/openziti/ziti/blob/main/quickstart/docker/all-in-one/compose.yml
#
# Brings up a single `ziti-controller` container that runs both the
# controller and an edge router in one process via `ziti edge
# quickstart`. The healthcheck waits until `ziti agent stats` succeeds,
# which fires once the embedded router has bound its listeners.
#
# Ports 1280 (controller edge API) and 3022 (router) are published to
# the host so the test runner (outside Docker) can reach them. The
# advertised addresses stay as `ziti-controller` / `ziti-router`; the
# CI workflow maps both names to 127.0.0.1 via /etc/hosts so that
# router URLs the SDK gets from the controller resolve correctly.

services:
  ziti:
    image: openziti/ziti-controller:latest
    container_name: ziti-quickstart
    restart: unless-stopped
    networks:
      quickstart:
        aliases:
          - ziti-controller
          - ziti-router
    entrypoint:
      - bash
      - -euc
      - |
        ZITI_CMD+=" --ctrl-address ziti-controller --ctrl-port 1280"\
        " --router-address ziti-router --router-port 3022"\
        " --password admin"
        echo "DEBUG: run command is: ziti $${@} $${ZITI_CMD}"
        exec ziti "$${@}" $${ZITI_CMD}
    command: -- edge quickstart --home /home/ziggy/quickstart
    user: "1000"
    environment:
      PFXLOG_NO_JSON: "true"
    volumes:
      - ziti_home:/home/ziggy
    ports:
      - "1280:1280"
      - "3022:3022"
    depends_on:
      ziti-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ziti", "agent", "stats"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  # Sets the volume's ownership so the non-root ziti user can write to it.
  ziti-init:
    image: busybox
    command: chown -Rc 1000 /home/ziggy
    user: root
    volumes:
      - ziti_home:/home/ziggy

networks:
  quickstart:
    driver: bridge

volumes:
  ziti_home:
    driver: local
