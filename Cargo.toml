[package]
name = "ziti-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Jascha Wanger <jascha@thirdkey.ai>"]
description = "Ziti Rust SDK - High-performance, async-first implementation for secure, zero-trust networking"
license = "MIT"
homepage = "https://github.com/jaschadub/ziti-rust"
repository = "https://github.com/jaschadub/ziti-rust"
documentation = "https://docs.rs/ziti-sdk"
readme = "README.md"
keywords = ["ziti", "zero-trust", "networking", "security", "async"]
categories = ["network-programming", "authentication", "cryptography"]
exclude = [
    "tests/*",
    ".github/*",
    "*.log",
    "target/*"
]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
rustls = "0.21"
tokio-rustls = "0.24"
reqwest = { version = "0.11", features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"
bytes = "1.4"
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
rustls-pemfile = "1.0"
webpki-roots = "0.25"
rand = "0.8"
futures-util = "0.3.31"

[dev-dependencies]
tokio-test = "0.4"

# Examples
[[example]]
name = "server"
path = "examples/server.rs"

[[example]]
name = "client"
path = "examples/client.rs"
