name: Integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --all-targets
      - name: cargo test (lib + doctests)
        run: cargo test --lib --doc
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  integration:
    name: Integration tests vs docker-compose Ziti
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Start Ziti network
        working-directory: tests/docker
        run: docker compose up -d --wait

      - name: Provision test identity and services
        working-directory: tests/docker
        run: ./bootstrap.sh

      - name: Run integration tests
        env:
          ZITI_IDENTITY_FILE: ${{ github.workspace }}/tests/docker/test-identity.json
          ZITI_TEST_SERVICE: echo-service
          ZITI_TEST_LISTEN_SERVICE: test-listen-service
          RUST_BACKTRACE: "1"
          RUST_LOG: ziti_sdk=debug
        run: cargo test --test integration -- --test-threads=1 --nocapture

      - name: Dump Ziti container logs on failure
        if: failure()
        working-directory: tests/docker
        run: docker compose logs --no-color
